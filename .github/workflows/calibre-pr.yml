name: Calibre import pull-request checks
on:
  pull_request:
    paths:
      - 'app/src/calibre_import.rs'
      - '.github/workflows/calibre-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibre:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          cache-on-failure: true
      - name: Check formatting
        working-directory: app
        run: cargo fmt --check
      - name: Test Calibre import and file safety
        working-directory: app
        run: cargo test --locked calibre_import::tests -- --test-threads=1
      - name: Check integrated Windows build
        working-directory: app
        run: cargo check --locked
