[package]
name = "biblioteca_sencilla"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "3.6"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu"] }
keyring = { version = "3.6", features = ["windows-native"] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
